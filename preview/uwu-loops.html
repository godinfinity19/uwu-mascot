<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>UwU — status loops</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js"></script>
  <script src="../src/uwu.js"></script>
  <script src="../src/uwu_anim.js"></script>
  <script src="../src/uwu_props.js"></script>
  <script src="../src/uwu_loops.js"></script>
  <style>
    html, body { margin: 0; background: #f9f1e6; font-family: system-ui, sans-serif; color: #52263b; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; justify-content: center; }
    nav a { padding: 6px 12px; border: 2px solid #e58fab; border-radius: 999px; color: inherit; text-decoration: none; font-size: 14px; }
    nav a.on { background: #e58fab; color: #fff; }
    main { display: grid; place-items: center; }
    canvas { max-width: 96vw; height: auto !important; }
  </style>
</head>
<body>
  <nav id="nav"></nav>
  <main id="main"></main>
  <script>
    // ?loop=<id> plays a status loop live (as fast as the browser can draw it).
    // &still draws frames only on request: renderFrame(n, bg) with bg "paper" | "black" | "white" | "clear".
    const params = new URLSearchParams(location.search);
    const id = params.get("loop") || "success";
    const still = params.has("still");
    const FPS = 60;
    const BG = { paper: "#f9f1e6", black: "#000000", white: "#ffffff", clear: null };
    let target = 0, targetBg = params.get("bg") || "paper", t0 = 0;

    async function setup() {
      window.UWU_FONT = await loadFont("../assets/fonts/DejaVuSans-Bold.ttf");
      createCanvas(720, 720, WEBGL).parent("main");
      pixelDensity(1);
      if (still) {
        noLoop();
        document.getElementById("nav").remove();
      } else {
        for (const lp of Object.values(UWU_LOOPS.LOOPS)) {
          const a = document.createElement("a");
          a.href = "?loop=" + lp.id;
          a.textContent = lp.title;
          if (lp.id === id) a.className = "on";
          document.getElementById("nav").appendChild(a);
        }
        t0 = millis();
      }
      const lp = UWU_LOOPS.LOOPS[id];
      window.UWU_FRAMES = Math.round(lp.T * FPS);
      window.UWU_LOOP_IDS = Object.keys(UWU_LOOPS.LOOPS);
      window.renderFrame = async (n, bg = "paper") => { target = n; targetBg = bg; await redraw(); };
      window.UWU_READY = true;
    }

    function draw() {
      if (!window.UWU_READY) return;
      const t = still ? target / FPS : (millis() - t0) / 1000;
      LOOP_RUNNER.frame(id, t, { bg: BG[targetBg] });
    }
  </script>
</body>
</html>
