<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UwU — expression reel</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5.brush@2.2.3/dist/p5.brush.js"></script>
  <script src="../src/uwu.js"></script>
  <script src="../src/uwu_anim.js"></script>
  <style>
    html, body { margin: 0; min-height: 100vh; background: #f9f1e6; display: grid; place-items: center; }
  </style>
</head>
<body>
  <script>
    // Plays the reel live. Add ?still to draw frames only on request (window.renderFrame(n), for video export).
    const still = location.search.includes("still");
    function setup() {
      createCanvas(1080, 1080, WEBGL);
      pixelDensity(1);
      frameRate(UWU_ANIM.FPS);
      if (still) noLoop();
      // Frames are drawn inside draw() so p5.brush flushes its last strokes at the end of each frame.
      window.renderFrame = async (n) => {
        target = n;
        await redraw();
      };
      window.UWU_FRAMES = Math.round(UWU_ANIM.DURATION * UWU_ANIM.FPS);
      window.UWU_READY = true;
    }
    let target = 0;
    function draw() {
      const n = still ? target : frameCount % window.UWU_FRAMES;
      background("#f9f1e6");
      const { pose, face, seed } = UWU_ANIM.state(n / UWU_ANIM.FPS);
      UWU.draw(0, 450, 1.8, { pose, face, seed });
    }
  </script>
</body>
</html>
